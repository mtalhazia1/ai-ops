# Local / demo stack: postgres, redis, n8n (main + worker, queue mode), Django app.
# Production adds Caddy via docker-compose.prod.yml.

x-n8n-env: &n8n-env
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
  N8N_HOST: ${N8N_HOST:-localhost}
  N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
  WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
  GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Karachi}
  TZ: ${GENERIC_TIMEZONE:-Asia/Karachi}
  EXECUTIONS_MODE: ${EXECUTIONS_MODE:-queue}
  QUEUE_BULL_REDIS_HOST: ${QUEUE_BULL_REDIS_HOST:-redis}
  QUEUE_HEALTH_CHECK_ACTIVE: "true"
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: ${DB_POSTGRESDB_HOST:-postgres}
  DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE:-n8n}
  DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER:-n8n}
  DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD:?set DB_POSTGRESDB_PASSWORD in .env}
  # Keep executions for 14 days (Section 9, n8n settings).
  EXECUTIONS_DATA_SAVE_ON_ERROR: all
  EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "336"
  N8N_RUNNERS_ENABLED: "true"
  N8N_LISTEN_ADDRESS: 0.0.0.0
  # Workflows read INTERNAL_TOKEN / APP_URL with {{$env.X}}.
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
  APP_URL: http://app:8001
  DASHBOARD_BASE_URL: ${DASHBOARD_BASE_URL:-http://localhost:8001}
  N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
  SHIPMATCH_ENABLED: ${SHIPMATCH_ENABLED:-false}
  SHIPMATCH_URL: ${SHIPMATCH_URL:-}
  SHIPMATCH_ORG: ${SHIPMATCH_ORG:-demo}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD}
      INBOX_DB_PASSWORD: ${INBOX_DB_PASSWORD:-inbox}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inbox && pg_isready -U postgres -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.43.2}
    restart: unless-stopped
    environment: *n8n-env
    ports:
      - "5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  n8n-worker:
    image: n8nio/n8n:${N8N_VERSION:-2.43.2}
    restart: unless-stopped
    command: worker
    environment:
      <<: *n8n-env
      QUEUE_HEALTH_CHECK_PORT: "5679"
      N8N_WORKER_SERVER_ADDRESS: 0.0.0.0
    volumes:
      - n8ndata:/home/node/.n8n
    depends_on:
      n8n: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5679/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build: ./app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://inbox:${INBOX_DB_PASSWORD:-inbox}@postgres:5432/inbox
    ports:
      - "8001:8001"
    volumes:
      - ./app/evals:/app/evals
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  pgdata:
  redisdata:
  n8ndata:
